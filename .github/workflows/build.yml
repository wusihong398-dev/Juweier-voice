name: Build Juweier Voice

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: rm -f test/widget_test.dart
      - name: Use Android compileSdk 36
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Voice-Android-v0.3.0
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - shell: pwsh
        run: Remove-Item test/widget_test.dart -Force -ErrorAction SilentlyContinue
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: flutter analyze
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Voice-Windows-v0.3.0
          path: build/windows/x64/runner/Release/**

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: rm -f test/widget_test.dart
      - name: Add iPhone media permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 橘味儿AI声演需要访问相册中的视频作为配音和参考声音素材" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 橘味儿AI声演需要使用相机录制视频作为声音素材" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 橘味儿AI声演需要使用麦克风采集配音和参考声音" ios/Runner/Info.plist || true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: Juweier-Voice-iOS-unsigned-v0.3.0
          path: build/ios/iphoneos/Runner.app/**
