name: Build 橘味儿配音

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android .
      - run: rm -f test/widget_test.dart
      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('android:label="juweier_voice"', 'android:label="橘味儿配音"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Use Android compileSdk 36
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 橘味儿配音-Android-v0.3.1
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - shell: pwsh
        run: Remove-Item test/widget_test.dart -Force -ErrorAction SilentlyContinue
      - name: Set Windows app name
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $main = 'windows/runner/main.cpp'
          $text = [System.IO.File]::ReadAllText($main)
          $text = $text.Replace('L"juweier_voice"', 'L"橘味儿配音"')
          [System.IO.File]::WriteAllText($main, $text, $utf8)
          $rc = 'windows/runner/Runner.rc'
          $rct = [System.IO.File]::ReadAllText($rc)
          $rct = $rct.Replace('juweier_voice', '橘味儿配音')
          [System.IO.File]::WriteAllText($rc, $rct, $utf8)
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: flutter analyze
      - run: flutter build windows --release
      - name: Rename Windows executable
        shell: pwsh
        run: |
          $old = 'build/windows/x64/runner/Release/juweier_voice.exe'
          if (Test-Path $old) { Rename-Item $old '橘味儿配音.exe' -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: 橘味儿配音-Windows-v0.3.1
          path: build/windows/x64/runner/Release/**

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=ios .
      - run: rm -f test/widget_test.dart
      - name: Set iOS app name and media permissions
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 橘味儿配音" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 橘味儿配音" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 橘味儿配音" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 橘味儿配音需要访问相册中的视频作为配音和参考声音素材" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 橘味儿配音需要使用相机录制视频作为声音素材" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 橘味儿配音需要使用麦克风采集配音和参考声音" ios/Runner/Info.plist || true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: 橘味儿配音-iOS-unsigned-v0.3.1
          path: build/ios/iphoneos/Runner.app/**
